name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk "RoseRequiem-${{ github.ref_name }}.apk"

      - name: Extract this version's changelog section
        run: |
          awk '/^## \[/{if (p) exit; p=1; next} p' CHANGELOG.md > RELEASE_NOTES.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "RoseRequiem-${{ github.ref_name }}.apk" \
            --title "Rose Requiem ${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md
