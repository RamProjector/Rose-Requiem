[versions]
accompanist-permissions = "0.34.0"
agp = "8.13.0"
coil-compose = "3.5.0"
okhttp = "5.4.0"
kotlin = "2.3.20"
core-ktx = "1.13.1"
kotlinx-coroutines-android = "1.8.1"
kotlinx-serialization-json = "1.11.0"
lifecycle-runtime-ktx = "2.8.6"
activity-compose = "1.13.0"
# Bumped from 2024.10.00 (the BOM was over a year and a half stale) to pull in every
# Compose bugfix/perf improvement released since, including a lot of scrolling and
# recomposition work in LazyColumn/Foundation.
# material3, animation, and material-icons-extended below are intentionally left
# WITHOUT their own version.ref: they're all covered by this BOM, and pinning them
# independently (as this catalog used to) means they silently stop moving forward
# when the BOM is bumped, which leaves you running a mismatched Compose graph --
# newer ui/foundation modules paired with a material3 build from a year and a half
# earlier. Let the BOM be the single source of truth for all of them.
compose-bom = "2026.06.00"
navigation-compose = "2.8.3"
navigation-runtime-ktx = "2.8.3"
preference = "1.2.1"
# 3.5.0 introduced a crash on pre-Android-8 devices when the CIO engine initializes
# (KTOR-9607: NoSuchMethodError on SecureRandom.getInstanceStrong(), API 26+ only --
# our minSdk is 23). Fixed in 3.5.1, released 25 June 2026; that's the floor here, not
# just "latest 3.x". 3.5.2 exists (31 Jul 2026, adds a UTF-8 multi-byte decoding fix
# that's plausibly relevant given how much CJK/Cyrillic/Arabic lyrics text flows
# through this client) but it's ~10 days old at the time of this bump -- worth moving
# to after 3.5.1's had a run on-device, not in the same change.
ktor = "3.5.1"
datastore = "1.1.1"
taglib = "1.0.0-alpha18"
kotlin-onetimepassword = "2.4.1"
androidx-baselineprofile = "1.3.1"
androidx-profileinstaller = "1.4.1"
androidx-benchmark-macro-junit4 = "1.3.1"
androidx-test-ext-junit = "1.2.1"
androidx-test-espresso-core = "3.6.1"
androidx-test-uiautomator = "2.3.0"

[libraries]
accompanist-permissions = { module = "com.google.accompanist:accompanist-permissions", version.ref = "accompanist-permissions" }
androidx-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation-compose" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil-compose" }
# coil-core stopped bundling network loading by default in 3.x; this is the fetcher that
# replaces it. Paired with plain OkHttp rather than coil-network-ktor3 -- Coil's own
# network-fetcher API has shifted shape across 3.x alphas/betas in ways the docs don't
# consistently agree on version-to-version, while the OkHttp fetcher factory signature
# has been identical in every source checked back to Coil 3.0. Cheaper to be sure about
# for a dependency this can't compile-test than to save one extra library.
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil-compose" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines-android" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle-runtime-ktx" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation" }
ui = { group = "androidx.compose.ui", name = "ui" }
ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-navigation-runtime-ktx = { group = "androidx.navigation", name = "navigation-runtime-ktx", version.ref = "navigation-runtime-ktx" }
androidx-preference = { group = "androidx.preference", name = "preference-ktx", version.ref = "preference" }
ktor-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-cio = { group = "io.ktor", name = "ktor-client-cio", version.ref = "ktor" }
ktor-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
taglib = { group = "com.github.Kyant0", name = "taglib", version.ref = "taglib" }
kotlin-onetimepassword = { group = "dev.turingcomplete", name = "kotlin-onetimepassword", version.ref = "kotlin-onetimepassword" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "androidx-profileinstaller" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "androidx-benchmark-macro-junit4" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-ext-junit" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidx-test-espresso-core" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "androidx-test-uiautomator" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidTest = { id = "com.android.test", version.ref = "agp" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "androidx-baselineprofile" }

[bundles]
